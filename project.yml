name: TouchBoost
options:
  bundleIdPrefix: com.touchboost
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_BITCODE: "NO"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"

targets:
  TouchBoost:
    type: application
    platform: iOS
    sources:
      - path: TouchBoost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touchboost.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
